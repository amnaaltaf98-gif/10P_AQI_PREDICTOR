name: Daily Retrain

on:
  schedule:
    - cron: "0 0 * * *"  # midnight UTC every day
  workflow_dispatch: {}

concurrency:
  group: daily-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Pull latest features, retrain, register model
        working-directory: training_pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python train.py

      - name: Upload trained models as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/

      - name: Publish updated models and SHAP plots for the dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/target_aqi_*_delta_xgb.pkl
          git add models/shap_target_aqi_*.png
          git add models/metrics.json
          if git diff --cached --quiet; then
            echo "No model or SHAP changes to publish."
            exit 0
          fi
          git commit -m "Update models and SHAP plots [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
