name: Daily Retrain

on:
  schedule:
    - cron: "0 0 * * *"  # midnight UTC every day
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Pull latest features, retrain, register model
        working-directory: training_pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python train.py

      - name: Upload trained models as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/
