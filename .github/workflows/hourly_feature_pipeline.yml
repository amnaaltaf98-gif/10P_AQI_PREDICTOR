name: Hourly Feature Pipeline

on:
  schedule:
    - cron: "5 * * * *"  # 5 minutes past every hour
  workflow_dispatch: {}    # allows manual trigger from the Actions tab

permissions:
  contents: write  # needed so this workflow can commit the updated buffer file back to the repo

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live data and push to Hopsworks
        working-directory: feature_pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python fetch_live_data.py

      - name: Commit updated rolling buffer back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_buffer.csv
          git diff --quiet --cached || git commit -m "Update live feature buffer [skip ci]"
          git push